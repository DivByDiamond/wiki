# nginx vhost for wiki.loki-code.dev (production).
#
# Cloudflare proxies the site and terminates TLS for visitors; nginx keeps its own
# certificate from certbot (nginx plugin) and proxies to the app on loopback.
# The app listens on 127.0.0.1:8091 (port 8080 is used by another container).
#
# The set_real_ip_from directives must be included inside the http {} context, e.g.
# copy this file to /etc/nginx/sites-available/wiki.loki-code.dev and link it into
# sites-enabled.

# Real client IP: trust CF-Connecting-IP only from Cloudflare. The real_ip module
# rewrites $remote_addr from the header but only when the TCP peer is one of the
# ranges below, so a client that reaches 443 directly cannot spoof its address and
# bypass every rate limit. Ranges: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name wiki.loki-code.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wiki.loki-code.dev;

    ssl_certificate     /etc/letsencrypt/live/wiki.loki-code.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.loki-code.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Above the app's 4 MiB url-encoded form cap, so the app's own 413/422 wins.
    client_max_body_size 5m;

    # App is down or restarting: show the static page with status 503.
    error_page 502 503 504 =503 /down.html;

    location = /down.html {
        internal;
        root /var/www/oc2r-wiki;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # real_ip already put the client address into $remote_addr; overwrite so the
        # client cannot spoof X-Real-IP / X-Forwarded-For itself.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
