# nginx vhost for wiki.loki-code.dev (production).
#
# Cloudflare proxies the site and terminates TLS for visitors; nginx keeps its own
# certificate from certbot (nginx plugin) and proxies to the app on loopback.
# The app listens on 127.0.0.1:8091 (port 8080 is used by another container).
#
# The map block must be included inside the http {} context, e.g. copy this file
# to /etc/nginx/sites-available/wiki.loki-code.dev and link it into sites-enabled.

# Real client IP: Cloudflare sends it in CF-Connecting-IP. Fall back to the TCP peer.
map $http_cf_connecting_ip $real_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name wiki.loki-code.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wiki.loki-code.dev;

    ssl_certificate     /etc/letsencrypt/live/wiki.loki-code.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.loki-code.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    # App is down or restarting: show the static page with status 503.
    error_page 502 503 504 =503 /down.html;

    location = /down.html {
        internal;
        root /var/www/oc2r-wiki;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, do not append: clients must not be able to spoof these headers.
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
    }
}
