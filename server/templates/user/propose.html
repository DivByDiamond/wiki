{% extends "layout/base.html" %}
{% block content %}
<h1>Suggest an edit: {{ shell.path }}</h1>
<form class="card" method="post" action="/propose/{{ shell.lang }}/{{ shell.path }}">
  <input type="hidden" name="base_rev" value="{{ base_rev }}">
  <div id="editor-toolbar"></div>
  <div class="field">
    <label for="editor">Text (Markdown)</label>
    <textarea id="editor" name="body" rows="24" required>{{ body }}</textarea>
  </div>
  <div class="field">
    <label for="summary">What did you change?</label>
    <input id="summary" name="summary" maxlength="200">
  </div>
  <button class="btn btn--primary" type="submit">Send suggestion</button>
</form>
{% endblock %}
